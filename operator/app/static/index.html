<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator</title><style>
body{font-family:system-ui;margin:0;background:#0b1220;color:#e8eef8}main{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#121d31;border:1px solid #263653;border-radius:16px;padding:16px;margin:12px 0}.bar{height:12px;background:#263653;border-radius:99px;overflow:hidden}.fill{height:100%;background:#4ade80}.muted{color:#9fb0c9}button{background:#e8eef8;border:0;padding:10px 14px;border-radius:10px;margin-right:8px}.status{font-weight:700}.waiting_human,.waiting_approval{color:#facc15}.failed{color:#fb7185}.completed{color:#4ade80}
</style></head><body><main><div class=top><div><h1>Operator</h1><div class=muted>Browser · Shell · GitHub · Checkpoint/Resume · Human handoff</div></div><button onclick=load()>Odśwież</button></div><div id=app></div></main><script>
const apiToken=localStorage.getItem('operatorToken')||''; const headers=apiToken?{Authorization:'Bearer '+apiToken}:{};
async function post(id,action){await fetch('/api/tasks/'+id+'/'+action,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:action==='approve'?JSON.stringify({approved:true}):action==='human-resume'?JSON.stringify({note:'Wykonano ręcznie'}):undefined});load()}
async function load(){let r=await fetch('/api/tasks',{headers});if(r.status===401){let t=prompt('Token Operatora');if(t){localStorage.setItem('operatorToken',t);location.reload()}return}let xs=await r.json();app.innerHTML=xs.map(x=>`<div class=card><div class=top><div><b>${x.name}</b><div class="status ${x.status}">${x.status}</div></div><b>${x.progress_pct}%</b></div><div class=bar><div class=fill style="width:${x.progress_pct}%"></div></div><p class=muted>Krok ${x.current_step}/${x.total_steps}${x.last_error?' · '+x.last_error:''}</p><button onclick="post('${x.id}','pause')">Pauza</button><button onclick="post('${x.id}','resume')">Wznów</button><button onclick="post('${x.id}','cancel')">Zatrzymaj</button>${x.status==='waiting_approval'?`<button onclick="post('${x.id}','approve')">Zatwierdź</button>`:''}${x.status==='waiting_human'?`<button onclick="post('${x.id}','human-resume')">Wykonane ręcznie</button>`:''}</div>`).join('')||'<div class=card>Brak zadań.</div>'}
load();setInterval(load,3000)
</script></body></html>
