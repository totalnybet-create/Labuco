name: LABUCO Admin Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/labuco-admin-preview.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: labuco-admin-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build LABUCO Spree with Dashboard
        run: docker build -f backend/Dockerfile -t labuco-spree-preview .

      - name: Prepare preview database
        run: createdb -h 127.0.0.1 -U postgres spree_preview || true

      - name: Start LABUCO Spree under Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/labuco-preview
          SECRET_KEY_BASE="$(openssl rand -hex 64)"
          cat >/tmp/labuco-preview/docker-compose.yml <<EOF
          services:
            web:
              image: labuco-spree-preview
              network_mode: host
              environment:
                DATABASE_URL: postgres://postgres@127.0.0.1:5432/spree_preview
                SECRET_KEY_BASE: ${SECRET_KEY_BASE}
                RAILS_ENV: production
                RAILS_LOG_TO_STDOUT: "true"
                RAILS_SERVE_STATIC_FILES: "true"
          EOF
          docker compose -f /tmp/labuco-preview/docker-compose.yml up -d

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then
              exit 0
            fi
            sleep 4
          done
          docker compose -f /tmp/labuco-preview/docker-compose.yml logs --no-color web
          exit 1

      - name: Seed base Spree store
        working-directory: /tmp/labuco-preview
        run: npx --yes @spree/cli@2.4.4 seed

      - name: Create isolated preview administrator
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f /tmp/labuco-preview/docker-compose.yml exec -T web ./bin/rails runner '
            admin = Spree::AdminUser.find_or_initialize_by(email: "spree@example.com")
            admin.password = "spree123"
            admin.password_confirmation = "spree123"
            admin.first_name = "LABUCO"
            admin.last_name = "Preview"
            admin.save!
          '

      - name: Create catalog import API key
        id: key
        working-directory: /tmp/labuco-preview
        shell: bash
        run: |
          set -euo pipefail
          out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoPreviewCatalog --type secret --scopes write_products)
          key=$(printf '%s\n' "$out" | grep -oE 'sk_[A-Za-z0-9_-]+' | head -n 1)
          test -n "$key"
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Import complete LABUCO catalog into Spree
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_API_KEY: ${{ steps.key.outputs.key }}
          LABUCO_ALLOW_PRODUCTION_IMPORT: YES
        shell: bash
        run: |
          set -euo pipefail
          python tools/labuco_spree_import.py data/labuco_catalog.json \
            --commit \
            --activate \
            --include-class-c \
            --limit 0 \
            --report /tmp/labuco-preview-import-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/labuco-preview-import-report.json').read_text(encoding='utf-8'))
          imported = report['created'] + report['updated']
          print(f"LABUCO_IMPORT requested={report['requested']} imported={imported} skipped={report['skipped']} failed={report['failed']}")
          if report['requested'] != 3316 or imported != 3316 or report['failed'] != 0:
              raise SystemExit('Full LABUCO catalog import verification failed')
          PY

      - name: Verify catalog inside Spree database
        shell: bash
        run: |
          set -euo pipefail
          raw=$(docker compose -f /tmp/labuco-preview/docker-compose.yml exec -T web \
            ./bin/rails runner 'puts "LABUCO_PRODUCT_COUNT=#{Spree::Product.count}"' 2>&1)
          printf '%s\n' "$raw"
          count=$(printf '%s\n' "$raw" | sed -n 's/^LABUCO_PRODUCT_COUNT=\([0-9][0-9]*\)$/\1/p' | tail -n 1)
          if [[ -z "$count" ]]; then
            echo "Unable to parse LABUCO product count from Rails output" >&2
            exit 1
          fi
          echo "Spree product count: ${count}"
          if (( count < 3316 )); then
            echo "Expected at least 3316 LABUCO products, found ${count}" >&2
            exit 1
          fi
          echo "LABUCO products verified in Spree: ${count}"

      - name: Install Cloudflare tunnel client
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start public preview tunnel
        id: tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 &
          for attempt in $(seq 1 60); do
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -n 1 || true)"
            if [[ -n "$url" ]]; then
              dashboard="${url}/dashboard"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "::notice title=LABUCO Admin Preview::${dashboard}"
              echo "## LABUCO Admin Preview — 3316 products" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Dashboard: ${dashboard}" >> "$GITHUB_STEP_SUMMARY"
              echo "Classic Admin: ${url}/admin" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Preview credentials: spree@example.com / spree123" >> "$GITHUB_STEP_SUMMARY"
              curl --fail-with-body -sS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d "{\"state\":\"success\",\"target_url\":\"${dashboard}\",\"description\":\"LABUCO Admin Preview: 3316 products live\",\"context\":\"LABUCO Admin Preview\"}" \
                >/dev/null
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Verify Dashboard over public URL
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          curl -I --fail --retry 10 --retry-delay 2 "${PREVIEW_URL}/dashboard" || \
            curl -I --fail --retry 10 --retry-delay 2 "${PREVIEW_URL}/admin"

      - name: Keep preview online
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          echo "LABUCO preview with full catalog is live at ${PREVIEW_URL}/dashboard"
          sleep 19800

      - name: Upload catalog import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labuco-admin-preview-import-report
          path: /tmp/labuco-preview-import-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f /tmp/labuco-preview/docker-compose.yml logs --no-color web || true

      - name: Stop containers
        if: always()
        run: docker compose -f /tmp/labuco-preview/docker-compose.yml down -v || true
