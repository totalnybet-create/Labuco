name: LABUCO Admin Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/labuco-admin-preview.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: labuco-admin-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Build LABUCO Spree with Dashboard
        run: docker build -f backend/Dockerfile -t labuco-spree-preview .

      - name: Prepare preview database
        run: createdb -h 127.0.0.1 -U postgres spree_preview || true

      - name: Start LABUCO Spree
        shell: bash
        run: |
          set -euo pipefail
          SECRET_KEY_BASE="$(openssl rand -hex 64)"
          docker run -d \
            --name labuco-spree \
            --network host \
            -e DATABASE_URL='postgres://postgres@127.0.0.1:5432/spree_preview' \
            -e SECRET_KEY_BASE="$SECRET_KEY_BASE" \
            -e RAILS_ENV=production \
            -e RAILS_LOG_TO_STDOUT=true \
            -e RAILS_SERVE_STATIC_FILES=true \
            labuco-spree-preview

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then
              exit 0
            fi
            sleep 4
          done
          docker logs labuco-spree
          exit 1

      - name: Create isolated preview administrator
        shell: bash
        run: |
          set -euo pipefail
          docker exec labuco-spree ./bin/rails runner '
            admin = Spree::AdminUser.find_or_initialize_by(email: "spree@example.com")
            admin.password = "spree123"
            admin.password_confirmation = "spree123"
            admin.first_name = "LABUCO"
            admin.last_name = "Preview"
            admin.save!
          '

      - name: Install Cloudflare tunnel client
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start public preview tunnel
        id: tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 &
          for attempt in $(seq 1 60); do
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -n 1 || true)"
            if [[ -n "$url" ]]; then
              dashboard="${url}/dashboard"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "::notice title=LABUCO Admin Preview::${dashboard}"
              echo "## LABUCO Admin Preview" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Dashboard: ${dashboard}" >> "$GITHUB_STEP_SUMMARY"
              echo "Classic Admin: ${url}/admin" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Preview credentials: spree@example.com / spree123" >> "$GITHUB_STEP_SUMMARY"
              curl --fail-with-body -sS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d "{\"state\":\"success\",\"target_url\":\"${dashboard}\",\"description\":\"LABUCO Admin Preview is live\",\"context\":\"LABUCO Admin Preview\"}" \
                >/dev/null
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Verify Dashboard over public URL
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          curl -I --fail --retry 10 --retry-delay 2 "${PREVIEW_URL}/dashboard" || \
            curl -I --fail --retry 10 --retry-delay 2 "${PREVIEW_URL}/admin"

      - name: Keep preview online
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          echo "LABUCO preview is live at ${PREVIEW_URL}/dashboard"
          sleep 19800
