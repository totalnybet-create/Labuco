name: LABUCO Storefront Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/labuco-storefront-preview.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: labuco-storefront-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Build LABUCO backend
        run: docker build -f backend/Dockerfile -t labuco-spree-storefront .

      - name: Prepare preview database
        run: createdb -h 127.0.0.1 -U postgres spree_storefront_preview || true

      - name: Start LABUCO backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/labuco-storefront-preview
          SECRET_KEY_BASE="$(openssl rand -hex 64)"
          cat >/tmp/labuco-storefront-preview/docker-compose.yml <<EOF
          services:
            web:
              image: labuco-spree-storefront
              network_mode: host
              environment:
                DATABASE_URL: postgres://postgres@127.0.0.1:5432/spree_storefront_preview
                SECRET_KEY_BASE: ${SECRET_KEY_BASE}
                RAILS_ENV: production
                RAILS_LOG_TO_STDOUT: "true"
                RAILS_SERVE_STATIC_FILES: "true"
          EOF
          docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml up -d

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then
              exit 0
            fi
            sleep 4
          done
          docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml logs --no-color web
          exit 1

      - name: Seed base Spree store
        working-directory: /tmp/labuco-storefront-preview
        run: npx --yes @spree/cli@2.4.4 seed

      - name: Create catalog import API key
        id: import-key
        working-directory: /tmp/labuco-storefront-preview
        shell: bash
        run: |
          set -euo pipefail
          out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoStorefrontCatalog --type secret --scopes write_products)
          key=$(printf '%s\n' "$out" | grep -oE 'sk_[A-Za-z0-9_-]+' | head -n 1)
          test -n "$key"
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Create storefront publishable key
        id: publishable-key
        working-directory: /tmp/labuco-storefront-preview
        shell: bash
        run: |
          set -euo pipefail
          out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoStorefrontPreview --type publishable)
          key=$(printf '%s\n' "$out" | grep -oE 'pk_[A-Za-z0-9_-]+' | head -n 1)
          test -n "$key"
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Import complete LABUCO catalog
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_API_KEY: ${{ steps.import-key.outputs.key }}
          LABUCO_ALLOW_PRODUCTION_IMPORT: YES
        shell: bash
        run: |
          set -euo pipefail
          python tools/labuco_spree_import.py data/labuco_catalog.json \
            --commit \
            --activate \
            --include-class-c \
            --limit 0 \
            --report /tmp/labuco-storefront-import-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/labuco-storefront-import-report.json').read_text(encoding='utf-8'))
          imported = report['created'] + report['updated']
          print(f"LABUCO_IMPORT requested={report['requested']} imported={imported} skipped={report['skipped']} failed={report['failed']}")
          if report['requested'] != 3316 or imported != 3316 or report['failed'] != 0:
              raise SystemExit('Full LABUCO catalog import verification failed')
          PY

      - name: Install storefront dependencies
        working-directory: apps/storefront
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        working-directory: apps/storefront
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_PUBLISHABLE_KEY: ${{ steps.publishable-key.outputs.key }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_DEFAULT_COUNTRY: pl
          NEXT_PUBLIC_DEFAULT_LOCALE: pl
        run: pnpm run build

      - name: Start storefront
        working-directory: apps/storefront
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_PUBLISHABLE_KEY: ${{ steps.publishable-key.outputs.key }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_DEFAULT_COUNTRY: pl
          NEXT_PUBLIC_DEFAULT_LOCALE: pl
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm start >/tmp/labuco-storefront.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent --location http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/labuco-storefront.log
          exit 1

      - name: Install Cloudflare tunnel client
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Start public storefront tunnel
        id: tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3001 --no-autoupdate \
            >/tmp/cloudflared-storefront.log 2>&1 &
          for attempt in $(seq 1 60); do
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared-storefront.log | tail -n 1 || true)"
            if [[ -n "$url" ]]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "::notice title=LABUCO Storefront Preview::${url}"
              echo "## LABUCO Storefront Preview — 3316 products" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Storefront: ${url}" >> "$GITHUB_STEP_SUMMARY"
              curl --fail-with-body -sS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d "{\"state\":\"success\",\"target_url\":\"${url}\",\"description\":\"LABUCO storefront: 3316 products live\",\"context\":\"LABUCO Storefront Preview\"}" \
                >/dev/null
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared-storefront.log
          exit 1

      - name: Verify storefront over public URL
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          curl --fail --location --retry 10 --retry-delay 2 "$PREVIEW_URL/" >/dev/null

      - name: Keep storefront online
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          echo "LABUCO storefront is live at ${PREVIEW_URL}"
          sleep 19800

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labuco-storefront-preview-import-report
          path: /tmp/labuco-storefront-import-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Dump logs on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/labuco-storefront.log || true
          docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml logs --no-color web || true

      - name: Stop containers
        if: always()
        run: docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml down -v || true
