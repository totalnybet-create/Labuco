name: LABUCO Storefront Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/labuco-storefront-preview.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: labuco-storefront-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Checkout proven LABUCO backend
        uses: actions/checkout@v4
        with:
          ref: ed09bb524f09eb7cd86c772f5792718e4f265947
          path: proven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Build proven LABUCO backend
        run: docker build -f proven/backend/Dockerfile -t labuco-spree-storefront proven

      - name: Prepare preview database
        run: createdb -h 127.0.0.1 -U postgres spree_storefront_preview || true

      - name: Start LABUCO backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/labuco-storefront-preview
          SECRET_KEY_BASE="$(openssl rand -hex 64)"
          cat >/tmp/labuco-storefront-preview/docker-compose.yml <<EOF
          services:
            web:
              image: labuco-spree-storefront
              network_mode: host
              environment:
                DATABASE_URL: postgres://postgres@127.0.0.1:5432/spree_storefront_preview
                SECRET_KEY_BASE: ${SECRET_KEY_BASE}
                RAILS_ENV: production
                RAILS_LOG_TO_STDOUT: "true"
                RAILS_SERVE_STATIC_FILES: "true"
          EOF
          docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml up -d

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then
              exit 0
            fi
            sleep 4
          done
          docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml logs --no-color web
          exit 1

      - name: Seed Spree
        working-directory: /tmp/labuco-storefront-preview
        run: npx --yes @spree/cli@2.4.4 seed

      - name: Create catalog and storefront API keys
        id: keys
        working-directory: /tmp/labuco-storefront-preview
        shell: bash
        run: |
          set -euo pipefail
          secret_out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoStorefrontCatalog --type secret --scopes write_products)
          secret=$(printf '%s\n' "$secret_out" | grep -oE 'sk_[A-Za-z0-9_-]+' | head -n 1)
          public_out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoStorefrontPreview --type publishable)
          public=$(printf '%s\n' "$public_out" | grep -oE 'pk_[A-Za-z0-9_-]+' | head -n 1)
          test -n "$secret"
          test -n "$public"
          echo "::add-mask::$secret"
          echo "::add-mask::$public"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          echo "public=$public" >> "$GITHUB_OUTPUT"

      - name: Import complete LABUCO catalog
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_API_KEY: ${{ steps.keys.outputs.secret }}
          LABUCO_ALLOW_PRODUCTION_IMPORT: YES
        shell: bash
        run: |
          set -euo pipefail
          python tools/labuco_spree_import.py data/labuco_catalog.json \
            --commit \
            --activate \
            --include-class-c \
            --limit 0 \
            --report /tmp/labuco-storefront-import-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/labuco-storefront-import-report.json').read_text(encoding='utf-8'))
          imported = report['created'] + report['updated']
          print(f"LABUCO_IMPORT requested={report['requested']} imported={imported} skipped={report['skipped']} failed={report['failed']}")
          if report['requested'] != 3316 or imported != 3316 or report['failed'] != 0:
              raise SystemExit('Full LABUCO catalog import verification failed')
          PY

      - name: Verify LABUCO catalog
        shell: bash
        run: |
          set -euo pipefail
          raw=$(docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml exec -T web \
            ./bin/rails runner 'puts "LABUCO_PRODUCT_COUNT=#{Spree::Product.count}"' 2>&1)
          printf '%s\n' "$raw"
          count=$(printf '%s\n' "$raw" | sed -n 's/^LABUCO_PRODUCT_COUNT=\([0-9][0-9]*\)$/\1/p' | tail -n 1)
          test -n "$count"
          if (( count < 3316 )); then
            echo "Expected at least 3316 LABUCO products, found ${count}" >&2
            exit 1
          fi

      - name: Install Cloudflare tunnel client
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Reserve public storefront URL
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3001 --no-autoupdate \
            >/tmp/cloudflared-storefront.log 2>&1 &
          for attempt in $(seq 1 60); do
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared-storefront.log | tail -n 1 || true)"
            if [[ -n "$url" ]]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "Reserved storefront URL: $url"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared-storefront.log
          exit 1

      - name: Build and start customer storefront
        working-directory: apps/storefront
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.public }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.tunnel.outputs.url }}
          NEXT_PUBLIC_DEFAULT_COUNTRY: pl
          NEXT_PUBLIC_DEFAULT_LOCALE: pl
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          nohup pnpm start >/tmp/labuco-storefront.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent --location http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/labuco-storefront.log
          exit 1

      - name: Verify and publish storefront URL
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          curl --fail --location --retry 15 --retry-delay 2 "$PREVIEW_URL/" >/dev/null
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${PREVIEW_URL}\",\"description\":\"LABUCO customer storefront: 3316 products live\",\"context\":\"LABUCO Storefront Preview\"}" \
            >/dev/null
          echo "## LABUCO Customer Storefront — 3316 products" >> "$GITHUB_STEP_SUMMARY"
          echo "Storefront: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep storefront online
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          echo "LABUCO customer storefront live: ${PREVIEW_URL}"
          sleep 19800

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labuco-storefront-preview-import-report
          path: /tmp/labuco-storefront-import-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Dump logs on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/labuco-storefront.log || true
          cat /tmp/cloudflared-storefront.log || true
          docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml logs --no-color web || true

      - name: Stop containers
        if: always()
        run: docker compose -f /tmp/labuco-storefront-preview/docker-compose.yml down -v || true
