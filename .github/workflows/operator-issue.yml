name: Operator Issue Dispatcher

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  execute:
    if: startsWith(github.event.issue.title, '[operator]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      OPERATOR_DB: /tmp/operator-issue.db
      OPERATOR_RESULT: operator-result.json
      OPERATOR_ARTIFACTS: operator-artifacts
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: operator/requirements.txt
      - name: Install Operator
        working-directory: operator
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Execute owner command
        id: execute
        continue-on-error: true
        run: python operator/issue_runner.py
      - name: Upload Operator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operator-issue-${{ github.event.issue.number }}
          path: |
            operator-result.json
            operator-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Report result to issue
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = 'Operator nie wygenerował pliku wyniku. Status kroku wykonawczego: `${{ steps.execute.outcome }}`.';
            let completed = false;
            if (fs.existsSync('operator-result.json')) {
              const r = JSON.parse(fs.readFileSync('operator-result.json','utf8'));
              body = `### Operator\n- status: **${r.status}**\n- postęp: **${r.progress_pct}%**\n- checkpoint: **${r.current_step}/${r.total_steps}**`;
              if (r.last_error) body += `\n- błąd: \`${String(r.last_error).slice(0,1200)}\``;
              completed = r.status === 'completed';
            }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            if (completed) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
