name: LABUCO Visual Audit

on:
  push:
    paths:
      - '.github/workflows/labuco-visual-audit.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare browser
        run: |
          mkdir -p /tmp/labuco-audit
          cd /tmp/labuco-audit
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture live storefront
        env:
          LABUCO_URL: https://actress-workers-bush-cigarette.trycloudflare.com
        run: |
          cd /tmp/labuco-audit
          cat > capture.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              ['mobile', 390, 844],
              ['desktop', 1440, 1200]
            ];
            for (const [name, width, height] of targets) {
              const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 });
              const page = await context.newPage();
              await page.goto(process.env.LABUCO_URL, { waitUntil: 'networkidle', timeout: 120000 });
              await page.waitForTimeout(2500);
              await page.screenshot({ path: `${name}.png`, fullPage: true });
              console.log(`${name}: ${page.url()} | ${await page.title()}`);
              await context.close();
            }
            await browser.close();
          })();
          EOF
          node capture.js

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: labuco-visual-audit
          path: |
            /tmp/labuco-audit/mobile.png
            /tmp/labuco-audit/desktop.png
          retention-days: 1
          if-no-files-found: error
