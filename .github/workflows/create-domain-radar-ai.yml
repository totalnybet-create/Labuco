name: Create DOMAIN-RADAR-AI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-domain-radar-ai.yml"

permissions:
  contents: read

jobs:
  create-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_OPERATOR_TOKEN }}
    steps:
      - name: Verify operator token
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_OPERATOR_TOKEN is not configured"
            exit 1
          fi

      - name: Create repository
        shell: bash
        run: |
          existing_status="$(curl --silent --output /tmp/domain-radar-repo.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/totalnybet-create/DOMAIN-RADAR-AI)"

          if [ "$existing_status" = "200" ]; then
            echo "Repository already exists"
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/repos \
            --data '{"name":"DOMAIN-RADAR-AI","description":"AI-assisted domain discovery and evaluation platform","private":true,"auto_init":true}'
