name: LABUCO Visual Check
# Fast reference-driven visual gate. Uses the checked-in catalog so screenshots
# validate the storefront presentation without rebuilding an unrelated backend.

on:
  push:
    paths:
      - '.github/workflows/labuco-visual-check.yml'
      - 'apps/storefront/**'

permissions:
  contents: read

concurrency:
  group: labuco-visual-check
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Build and start storefront in catalog mode
        working-directory: apps/storefront
        env:
          COMMERCE_PROVIDER: catalog
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_DEFAULT_COUNTRY: pl
          NEXT_PUBLIC_DEFAULT_LOCALE: pl
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          nohup pnpm start >/tmp/labuco-storefront.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --location http://127.0.0.1:3001/pl/pl >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/labuco-storefront.log
          exit 1

      - name: Verify catalog price contract
        working-directory: apps/storefront
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium >/dev/null
          pnpm exec playwright test --config=playwright.catalog.config.ts --grep "catalog mode works without Spree" --reporter=line

      - name: Capture mobile and desktop references
        working-directory: apps/storefront
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright screenshot --browser chromium --viewport-size "390,910" --wait-for-timeout 2000 --full-page http://127.0.0.1:3001/pl/pl /tmp/mobile-full.png
          pnpm exec playwright screenshot --browser chromium --viewport-size "390,910" --wait-for-timeout 2000 http://127.0.0.1:3001/pl/pl /tmp/mobile-viewport.png
          pnpm exec playwright screenshot --browser chromium --viewport-size "1440,1000" --wait-for-timeout 2000 --full-page http://127.0.0.1:3001/pl/pl /tmp/desktop-full.png
          pnpm exec playwright screenshot --browser chromium --viewport-size "1440,1000" --wait-for-timeout 2000 http://127.0.0.1:3001/pl/pl /tmp/desktop-viewport.png
          file /tmp/mobile-full.png /tmp/mobile-viewport.png /tmp/desktop-full.png /tmp/desktop-viewport.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: labuco-reference-check
          path: |
            /tmp/mobile-full.png
            /tmp/mobile-viewport.png
            /tmp/desktop-full.png
            /tmp/desktop-viewport.png
          retention-days: 1
          if-no-files-found: error

      - name: Dump storefront log on failure
        if: failure()
        run: cat /tmp/labuco-storefront.log || true
