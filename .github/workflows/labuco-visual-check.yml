name: LABUCO Visual Check

on:
  push:
    paths:
      - '.github/workflows/labuco-visual-check.yml'

permissions:
  contents: read
  statuses: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for current storefront preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: b796f74dd629575a6b08e23e4bee351ad79530ff
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            payload=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PREVIEW_SHA}/status")
            url=$(printf '%s' "$payload" | jq -r '.statuses[] | select(.context == "LABUCO Storefront Preview" and .state == "success") | .target_url' | head -n1)
            if [[ -n "$url" && "$url" != "null" ]]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Storefront preview URL was not published in time" >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/labuco-visual
          cd /tmp/labuco-visual
          npm init -y >/dev/null 2>&1
          npm install playwright@1.60.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture mobile storefront
        env:
          LABUCO_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          cd /tmp/labuco-visual
          cat > capture.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 910 }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            await page.goto(process.env.LABUCO_URL, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'mobile-full.png', fullPage: true });
            await page.screenshot({ path: 'mobile-viewport.png', fullPage: false });
            console.log(`URL=${page.url()}`);
            console.log(`TITLE=${await page.title()}`);
            console.log(`SIZE=${await page.evaluate(() => JSON.stringify({width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight}))}`);
            await browser.close();
          })();
          EOF
          node capture.js

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: labuco-reference-check
          path: |
            /tmp/labuco-visual/mobile-full.png
            /tmp/labuco-visual/mobile-viewport.png
          retention-days: 1
          if-no-files-found: error
