name: LABUCO Visual Check

on:
  push:
    paths:
      - '.github/workflows/labuco-visual-check.yml'
      - 'apps/storefront/**'
      - 'backend/**'
      - 'data/labuco_catalog.json'
      - 'tools/labuco_spree_import.py'
  pull_request:
    paths:
      - '.github/workflows/labuco-visual-check.yml'
      - 'apps/storefront/**'
      - 'backend/**'
      - 'data/labuco_catalog.json'
      - 'tools/labuco_spree_import.py'

permissions:
  contents: read

concurrency:
  group: labuco-visual-check
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Build backend
        run: docker build -f backend/Dockerfile -t labuco-visual-backend .

      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres spree_visual_check || true
          mkdir -p /tmp/labuco-visual
          SECRET_KEY_BASE="$(openssl rand -hex 64)"
          cat >/tmp/labuco-visual/docker-compose.yml <<EOF
          services:
            web:
              image: labuco-visual-backend
              network_mode: host
              environment:
                DATABASE_URL: postgres://postgres@127.0.0.1:5432/spree_visual_check
                SECRET_KEY_BASE: ${SECRET_KEY_BASE}
                RAILS_ENV: production
                RAILS_LOG_TO_STDOUT: "true"
                RAILS_SERVE_STATIC_FILES: "true"
          EOF
          docker compose -f /tmp/labuco-visual/docker-compose.yml up -d
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then exit 0; fi
            sleep 4
          done
          exit 1

      - name: Seed and configure market
        shell: bash
        working-directory: /tmp/labuco-visual
        run: |
          set -euo pipefail
          npx --yes @spree/cli@2.4.4 seed
          docker compose -f docker-compose.yml exec -T web ./bin/rails runner '
            store = Spree::Store.default
            poland = Spree::Country.find_by!(iso: "PL")
            store.update!(name: "Labuco", default_country: poland, default_currency: "PLN", supported_currencies: ["PLN"], default_locale: "pl", supported_locales: ["pl"])
            market = store.markets.find_by(default: true) || store.markets.first
            store.markets.where.not(id: market.id).update_all(default: false)
            market.update!(name: "Polska", currency: "PLN", default_locale: "pl", supported_locales: ["pl"], default: true)
            market.countries = [poland]
          '

      - name: Create API keys
        id: keys
        working-directory: /tmp/labuco-visual
        shell: bash
        run: |
          set -euo pipefail
          secret_out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoVisualCatalog --type secret --scopes write_products)
          secret=$(printf '%s\n' "$secret_out" | grep -oE 'sk_[A-Za-z0-9_-]+' | head -n1)
          public_out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoVisualStorefront --type publishable)
          public=$(printf '%s\n' "$public_out" | grep -oE 'pk_[A-Za-z0-9_-]+' | head -n1)
          test -n "$secret"; test -n "$public"
          echo "::add-mask::$secret"; echo "::add-mask::$public"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          echo "public=$public" >> "$GITHUB_OUTPUT"

      - name: Import starter products
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_API_KEY: ${{ steps.keys.outputs.secret }}
          LABUCO_ALLOW_PRODUCTION_IMPORT: YES
        shell: bash
        run: |
          set -euo pipefail
          python tools/labuco_spree_import.py data/labuco_catalog.json --commit --activate --include-class-c --limit 100 --report /tmp/labuco-visual/starter.json
          docker compose -f /tmp/labuco-visual/docker-compose.yml exec -T web ./bin/rails runner '
            store = Spree::Store.default
            channel = store.channels.find_by(active: true) || store.channels.first
            products = Spree::Product.where(store_id: [nil, store.id])
            products.where(store_id: nil).update_all(store_id: store.id)
            products.find_each do |product|
              publication = Spree::ProductPublication.find_or_initialize_by(product: product, channel: channel)
              publication.published_at ||= Time.current
              publication.unpublished_at = nil
              publication.save!
            end
          '

      - name: Build and start storefront
        working-directory: apps/storefront
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.public }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_DEFAULT_COUNTRY: pl
          NEXT_PUBLIC_DEFAULT_LOCALE: pl
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          nohup pnpm start >/tmp/labuco-visual/storefront.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent --location http://127.0.0.1:3001/pl/pl >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/labuco-visual/storefront.log
          exit 1

      - name: Smoke test and capture mobile + desktop
        working-directory: apps/storefront
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const { chromium } = require('@playwright/test')

          async function verify(viewport, prefix) {
            const browser = await chromium.launch()
            const page = await browser.newPage({ viewport })
            await page.goto('http://127.0.0.1:3001/pl/pl', { waitUntil: 'networkidle' })

            const productHrefs = await page.locator('a[href*="/products/"]').evaluateAll((links) =>
              [...new Set(links.map((link) => link.getAttribute('href')).filter(Boolean))]
            )
            if (productHrefs.length < 1) throw new Error('Homepage has no product links')
            const guideHref = await page.locator('a[href*="/guides/"]').first().getAttribute('href')
            if (!guideHref) throw new Error('Homepage has no working guide links')
            if ((await page.locator('body').innerText()).includes('Nie znaleziono produktów')) {
              throw new Error('Homepage renders an empty product state')
            }

            const overflow = await page.evaluate(() =>
              Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth
            )
            if (overflow > 1) throw new Error(`Horizontal overflow: ${overflow}px`)

            await page.screenshot({ path: `/tmp/labuco-visual/${prefix}-viewport.png` })
            await page.screenshot({ path: `/tmp/labuco-visual/${prefix}-full.png`, fullPage: true })

            await page.goto(`http://127.0.0.1:3001${productHrefs[0]}`, { waitUntil: 'networkidle' })
            const firstProductText = await page.locator('main').innerText()
            if (!firstProductText.includes('149,00 zł') || firstProductText.includes('14 900,00 zł')) {
              throw new Error('Storefront price does not match the 149.00 PLN catalog source')
            }

            let productName = ''
            let addToCart = null
            for (const productHref of productHrefs.slice(0, 12)) {
              await page.goto(`http://127.0.0.1:3001${productHref}`, { waitUntil: 'networkidle' })
              const candidate = page.getByRole('button', { name: 'Dodaj do koszyka' })
              if ((await candidate.count()) > 0 && !(await candidate.isDisabled())) {
                productName = (await page.getByRole('heading', { level: 1 }).innerText()).trim()
                addToCart = candidate
                break
              }
            }
            if (!addToCart) throw new Error('Homepage has no purchasable products')
            await addToCart.click()
            const cartDrawer = page.getByRole('dialog')
            await cartDrawer.waitFor()
            if (!(await cartDrawer.innerText()).includes(productName)) {
              throw new Error('Added product is missing from the cart drawer')
            }

            await page.goto(`http://127.0.0.1:3001${guideHref}`, { waitUntil: 'networkidle' })
            await page.getByRole('heading', { level: 1 }).waitFor()
            if ((await page.locator('main').innerText()).trim().length < 500) {
              throw new Error('Guide page does not contain complete content')
            }

            await browser.close()
          }

          Promise.all([
            verify({ width: 390, height: 910 }, 'mobile'),
            verify({ width: 1440, height: 1000 }, 'desktop'),
          ]).catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
          file /tmp/labuco-visual/mobile-full.png /tmp/labuco-visual/mobile-viewport.png /tmp/labuco-visual/desktop-full.png /tmp/labuco-visual/desktop-viewport.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: labuco-reference-check
          path: |
            /tmp/labuco-visual/mobile-full.png
            /tmp/labuco-visual/mobile-viewport.png
            /tmp/labuco-visual/desktop-full.png
            /tmp/labuco-visual/desktop-viewport.png
          retention-days: 1
          if-no-files-found: error

      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/labuco-visual/storefront.log || true
          docker compose -f /tmp/labuco-visual/docker-compose.yml logs --no-color web || true
