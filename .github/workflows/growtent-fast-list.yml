name: GrowTent Fast List

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/growtent_fast_list.py"
      - ".github/workflows/growtent-fast-list.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: python -m pip install -q httpx[http2] beautifulsoup4 lxml
      - name: Build product list with photos
        env:
          OUTPUT_DIR: artifacts/growtent-fast
          WORKERS: "24"
        run: python tools/growtent_fast_list.py
      - name: Upload list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: growtent-fast-list
          path: artifacts/growtent-fast/
          if-no-files-found: warn
          retention-days: 14
