name: Catalog Spree Smoke

on:
  push:
    branches: [test/spree-20-product-import]
    paths:
      - '.github/workflows/catalog-spree-smoke.yml'
      - 'tools/labuco_spree_import.py'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-20-products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build project backend image
        run: docker build -t project-spree:catalog-smoke backend

      - name: Boot Spree backend
        working-directory: apps/storefront
        env:
          SPREE_IMAGE: project-spree:catalog-smoke
        run: docker compose -f e2e-backend/docker-compose.yml up -d --wait

      - name: Seed base Spree store
        working-directory: apps/storefront/e2e-backend
        run: npx --yes @spree/cli@2.4.4 seed

      - name: Create write-products API key
        id: key
        working-directory: apps/storefront/e2e-backend
        shell: bash
        run: |
          set -euo pipefail
          out=$(npx --yes @spree/cli@2.4.4 api-key create --name CatalogSmoke --type secret --scopes write_products)
          key=$(printf '%s\n' "$out" | grep -oE 'sk_[A-Za-z0-9_-]+' | head -n 1)
          test -n "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Build 20-product Labuco fixture
        run: |
          python - <<'PY'
          import json
          rows=[]
          for i in range(1,21):
              rows.append({
                  'labuco_sku': f'LAB-SMOKE-{i:03d}',
                  'brand': 'Labuco Test',
                  'our_title': f'Labuco test produktu {i}',
                  'our_short_description': 'Kontrolny produkt Labuco do testu importu.',
                  'our_description': 'Kontrolny rekord sprawdzający tworzenie produktu, ceny, kosztu i SKU w Spree.',
                  'category': 'Test',
                  'wholesale_cost_pln': '40.00',
                  'labuco_price_pln': '50.90',
                  'labuco_price_class': 'A'
              })
          open('/tmp/labuco-smoke.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False))
          PY

      - name: Import 20 Labuco products as drafts
        env:
          SPREE_API_URL: http://localhost:4000
          SPREE_API_KEY: ${{ steps.key.outputs.key }}
        run: python tools/labuco_spree_import.py /tmp/labuco-smoke.json --commit --limit 20 --report /tmp/import-report.json

      - name: Verify exactly 20 imported SKUs in Spree database
        working-directory: apps/storefront
        run: |
          count=$(docker compose -f e2e-backend/docker-compose.yml exec -T web bin/rails runner "puts Spree::Variant.where('sku LIKE ?', 'LAB-SMOKE-%').count" | tail -n 1 | tr -d '\r')
          echo "Imported variants: $count"
          test "$count" = "20"

      - name: Upload import report
        uses: actions/upload-artifact@v4
        with:
          name: labuco-spree-smoke-report
          path: /tmp/import-report.json
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        working-directory: apps/storefront
        run: docker compose -f e2e-backend/docker-compose.yml logs --no-color web || true

      - name: Tear down
        if: always()
        working-directory: apps/storefront
        run: docker compose -f e2e-backend/docker-compose.yml down -v
