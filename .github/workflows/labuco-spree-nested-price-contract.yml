name: LABUCO Spree Nested Price Contract

on:
  push:
    branches:
      - redesign/labuco-visual-reset-20260816
    paths:
      - '.github/workflows/labuco-spree-nested-price-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout proven LABUCO backend
        uses: actions/checkout@v4
        with:
          ref: ed09bb524f09eb7cd86c772f5792718e4f265947
          path: proven
      - name: Build backend
        run: docker build -f proven/backend/Dockerfile -t labuco-nested-price proven
      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres spree_nested_price || true
          mkdir -p /tmp/labuco-nested-price
          SECRET_KEY_BASE="$(openssl rand -hex 64)"
          cat >/tmp/labuco-nested-price/docker-compose.yml <<EOF
          services:
            web:
              image: labuco-nested-price
              network_mode: host
              environment:
                DATABASE_URL: postgres://postgres@127.0.0.1:5432/spree_nested_price
                SECRET_KEY_BASE: ${SECRET_KEY_BASE}
                RAILS_ENV: production
                RAILS_LOG_TO_STDOUT: 'true'
                RAILS_SERVE_STATIC_FILES: 'true'
          EOF
          docker compose -f /tmp/labuco-nested-price/docker-compose.yml up -d
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then exit 0; fi
            sleep 4
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seed market and create admin API key
        id: key
        working-directory: /tmp/labuco-nested-price
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @spree/cli@2.4.4 seed
          docker compose -f docker-compose.yml exec -T web ./bin/rails runner '
            store = Spree::Store.default
            pl = Spree::Country.find_by!(iso: "PL")
            store.update!(name: "Labuco", default_country: pl, default_currency: "PLN", supported_currencies: ["PLN"], default_locale: "pl", supported_locales: ["pl"])
            market = store.markets.find_by(default: true) || store.markets.first
            store.markets.where.not(id: market.id).update_all(default: false)
            market.update!(name: "Polska", currency: "PLN", default_locale: "pl", supported_locales: ["pl"], default: true)
            market.countries = [pl]
          '
          out=$(npx --yes @spree/cli@2.4.4 api-key create --name NestedPriceDiag --type secret --scopes write_products)
          key=$(printf '%s\n' "$out" | grep -oE 'sk_[A-Za-z0-9_-]+' | head -n1)
          test -n "$key"
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Inspect nested product create/update implementation
        working-directory: /tmp/labuco-nested-price
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml exec -T web sh -lc '
            core=$(bundle show spree_core)
            api=$(bundle show spree_api)
            echo "CORE=$core"
            echo "API=$api"
            echo "=== PRODUCT SERVICES ==="
            grep -R -n -E "class Create|class Update|Products::Create|Products::Update|prices_attributes|amount_cents|price.*amount|amount.*price" "$core/app" "$core/lib" "$api/app" "$api/lib" 2>/dev/null | grep -E "admin|product|variant|price" | head -n 500 || true
            echo "=== PRICE MODEL ==="
            sed -n "1,240p" "$core/app/models/spree/price.rb" || true
            echo "=== PRODUCT SERVICE FILES ==="
            find "$core/app" "$core/lib" "$api/app" "$api/lib" -type f \( -iname "*product*create*.rb" -o -iname "*product*update*.rb" -o -iname "*variant*create*.rb" -o -iname "*variant*update*.rb" -o -iname "*price*.rb" \) -print | sort | head -n 120
          '
      - name: Probe nested payload variants
        env:
          API_KEY: ${{ steps.key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base='http://127.0.0.1:3000/api/v3/admin/products'
          key=os.environ['API_KEY']
          probes=[
            ('amount_149_decimal', {'amount':'149.00'}),
            ('amount_1_49_decimal', {'amount':'1.49'}),
            ('amount_149_integer', {'amount':149}),
            ('amount_cents_14900', {'amount_cents':14900}),
            ('amount_in_cents_14900', {'amount_in_cents':14900}),
            ('price_149_decimal', {'price':'149.00'}),
          ]
          def req(payload):
            data=json.dumps({'product':payload}).encode()
            r=urllib.request.Request(base,data=data,method='POST',headers={'Content-Type':'application/json','Authorization':f'Bearer {key}'})
            try:
              with urllib.request.urlopen(r,timeout=20) as resp:
                return resp.status, resp.read().decode()
            except urllib.error.HTTPError as e:
              return e.code, e.read().decode()
          for idx,(label,price) in enumerate(probes,1):
            payload={'name':f'Probe {label}','status':'active','variants':[{'sku':f'PROBE-{idx}','prices':[{'currency':'PLN',**price}]}]}
            status,body=req(payload)
            print('PROBE_RESPONSE',label,'status=',status,'body=',body[:1200])
          PY
      - name: Inspect DB and Store API after probes
        working-directory: /tmp/labuco-nested-price
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml exec -T web ./bin/rails runner '
            Spree::Product.where("name LIKE ?", "Probe %").order(:id).each do |product|
              variant = product.master
              price = variant.prices.find_by(currency: "PLN")
              puts "PROBE_DB=" + {name: product.name, sku: variant.sku, amount: price&.amount, amount_in_cents: (price&.respond_to?(:amount_in_cents) ? price.amount_in_cents : nil), display_amount: (price&.respond_to?(:display_amount) ? price.display_amount.to_s : nil)}.inspect
            end
          '
          echo '=== STORE API ==='
          curl -fsS 'http://127.0.0.1:3000/api/v3/store/products?currency=PLN&locale=pl&per_page=20' | python -m json.tool | head -n 500 || true
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f /tmp/labuco-nested-price/docker-compose.yml logs web || true
