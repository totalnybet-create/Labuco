name: LABUCO Quick Storefront Preview

on:
  push:
    branches:
      - ops/quick-storefront-preview
    paths:
      - '.github/workflows/labuco-quick-preview-temp.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: labuco-quick-storefront-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Build current LABUCO backend
        run: docker build -f backend/Dockerfile -t labuco-spree-quick .

      - name: Prepare preview database
        run: createdb -h 127.0.0.1 -U postgres spree_quick_preview || true

      - name: Start LABUCO backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/labuco-quick-preview
          SECRET_KEY_BASE="$(openssl rand -hex 64)"
          cat >/tmp/labuco-quick-preview/docker-compose.yml <<EOF
          services:
            web:
              image: labuco-spree-quick
              network_mode: host
              environment:
                DATABASE_URL: postgres://postgres@127.0.0.1:5432/spree_quick_preview
                SECRET_KEY_BASE: ${SECRET_KEY_BASE}
                RAILS_ENV: production
                RAILS_LOG_TO_STDOUT: "true"
                RAILS_SERVE_STATIC_FILES: "true"
          EOF
          docker compose -f /tmp/labuco-quick-preview/docker-compose.yml up -d

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then
              exit 0
            fi
            sleep 4
          done
          docker compose -f /tmp/labuco-quick-preview/docker-compose.yml logs --no-color web
          exit 1

      - name: Seed Spree
        working-directory: /tmp/labuco-quick-preview
        run: npx --yes @spree/cli@2.4.4 seed

      - name: Configure Polish LABUCO market
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f /tmp/labuco-quick-preview/docker-compose.yml exec -T web \
            ./bin/rails runner '
              store = Spree::Store.default
              poland = Spree::Country.find_by!(iso: "PL")
              store.update!(name: "Labuco", default_country: poland, default_currency: "PLN", supported_currencies: ["PLN"], default_locale: "pl", supported_locales: ["pl"])
              market = store.markets.find_by(default: true) || store.markets.first
              raise "Seed did not create a market" unless market
              store.markets.where.not(id: market.id).update_all(default: false)
              market.update!(name: "Polska", currency: "PLN", default_locale: "pl", supported_locales: ["pl"], default: true)
              market.countries = [poland]
            '

      - name: Create catalog and storefront API keys
        id: keys
        working-directory: /tmp/labuco-quick-preview
        shell: bash
        run: |
          set -euo pipefail
          secret_out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoQuickCatalog --type secret --scopes write_products)
          secret=$(printf '%s\n' "$secret_out" | grep -oE 'sk_[A-Za-z0-9_-]+' | head -n 1)
          public_out=$(npx --yes @spree/cli@2.4.4 api-key create --name LabucoQuickStorefront --type publishable)
          public=$(printf '%s\n' "$public_out" | grep -oE 'pk_[A-Za-z0-9_-]+' | head -n 1)
          test -n "$secret"
          test -n "$public"
          echo "::add-mask::$secret"
          echo "::add-mask::$public"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          echo "public=$public" >> "$GITHUB_OUTPUT"

      - name: Import 100 LABUCO products
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_API_KEY: ${{ steps.keys.outputs.secret }}
          LABUCO_ALLOW_PRODUCTION_IMPORT: YES
        shell: bash
        run: |
          set -euo pipefail
          python tools/labuco_spree_import.py data/labuco_catalog.json \
            --commit \
            --activate \
            --include-class-c \
            --limit 100 \
            --report /tmp/labuco-quick-import-report.json

      - name: Publish products
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f /tmp/labuco-quick-preview/docker-compose.yml exec -T web \
            ./bin/rails runner '
              store = Spree::Store.default
              channel = store.channels.find_by(active: true) || store.channels.first
              raise "Seed did not create an active customer channel" unless channel
              products = Spree::Product.where(store_id: [nil, store.id])
              products.where(store_id: nil).update_all(store_id: store.id)
              products.find_each do |product|
                publication = Spree::ProductPublication.find_or_initialize_by(product: product, channel: channel)
                publication.published_at ||= Time.current
                publication.unpublished_at = nil
                publication.save!
              end
            '

      - name: Install Cloudflare tunnel client
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Reserve public storefront URL
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3001 --no-autoupdate \
            >/tmp/cloudflared-quick-storefront.log 2>&1 &
          for attempt in $(seq 1 60); do
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared-quick-storefront.log | tail -n 1 || true)"
            if [[ -n "$url" ]]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "Reserved storefront URL: $url"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared-quick-storefront.log
          exit 1

      - name: Build and start customer storefront
        working-directory: apps/storefront
        env:
          SPREE_API_URL: http://127.0.0.1:3000
          SPREE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.public }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.tunnel.outputs.url }}
          NEXT_PUBLIC_DEFAULT_COUNTRY: pl
          NEXT_PUBLIC_DEFAULT_LOCALE: pl
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          nohup pnpm start >/tmp/labuco-quick-storefront.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent --location http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/labuco-quick-storefront.log
          exit 1

      - name: Verify and publish storefront URL
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          page=$(curl --fail --location --retry 15 --retry-delay 2 "$PREVIEW_URL/pl/pl")
          if printf '%s' "$page" | grep -q 'Nie znaleziono produkt'; then
            echo "Storefront rendered an empty catalog" >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${PREVIEW_URL}\",\"description\":\"LABUCO quick storefront is live\",\"context\":\"LABUCO Quick Storefront Preview\"}" \
            >/dev/null

      - name: Keep storefront online
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          echo "LABUCO quick storefront live: ${PREVIEW_URL}"
          sleep 14400

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labuco-quick-storefront-import-report
          path: /tmp/labuco-quick-import-report.json
          retention-days: 2
          if-no-files-found: warn

      - name: Dump logs on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/labuco-quick-storefront.log || true
          cat /tmp/cloudflared-quick-storefront.log || true
          docker compose -f /tmp/labuco-quick-preview/docker-compose.yml logs --no-color web || true

      - name: Stop containers
        if: always()
        run: docker compose -f /tmp/labuco-quick-preview/docker-compose.yml down -v || true
