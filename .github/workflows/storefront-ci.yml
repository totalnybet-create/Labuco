name: Storefront CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/storefront/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/storefront/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/storefront/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/storefront/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/storefront/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/storefront/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    name: Production Build (Spree)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/storefront/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/storefront/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build project backend image
        run: docker build -t project-spree:build "$GITHUB_WORKSPACE/backend"
      - name: Boot Spree backend
        env:
          SPREE_IMAGE: project-spree:build
        run: docker compose -f e2e-backend/docker-compose.yml up -d --wait
      - name: Seed Spree and issue publishable key
        working-directory: apps/storefront/e2e-backend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @spree/cli@2.4.4 seed
          npx --yes @spree/cli@2.4.4 sample-data
          out=$(npx --yes @spree/cli@2.4.4 api-key create --name StorefrontBuild --type publishable)
          key=$(printf '%s\n' "$out" | grep -oE 'pk_[A-Za-z0-9_-]+' | head -n 1)
          test -n "$key"
          echo "SPREE_API_URL=http://localhost:4000" >> "$GITHUB_ENV"
          echo "SPREE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Build production storefront
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          NEXT_PUBLIC_DEFAULT_COUNTRY: pl
          NEXT_PUBLIC_DEFAULT_LOCALE: pl
        run: pnpm run build
      - name: Dump Spree logs on failure
        if: failure()
        run: docker compose -f e2e-backend/docker-compose.yml logs --no-color web > spree-build.log || true
      - name: Upload build failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storefront-build-logs
          path: apps/storefront/spree-build.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f e2e-backend/docker-compose.yml down -v

  e2e:
    name: E2E (Playwright + Spree)
    # Repository secrets are not exposed to runs triggered from forks, nor
    # to dependabot[bot] runs (those only get Dependabot secrets), so the
    # Stripe-backed checkout E2E cannot run there — skip the job (shows as
    # "skipped", not failed). For same-repository runs the configuration step
    # below reports missing sandbox keys and safely skips the Stripe-dependent
    # setup instead of making otherwise healthy CI fail.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/storefront
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Detect Stripe E2E configuration
        id: stripe-config
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Stripe checkout E2E skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure STRIPE_SECRET_KEY and STRIPE_PUBLISHABLE_KEY from the same Stripe sandbox to enable it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.stripe-config.outputs.enabled == 'true'
        with:
          package_json_file: apps/storefront/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.stripe-config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/storefront/pnpm-lock.yaml
      - if: steps.stripe-config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      # Key the browser cache on the Playwright version, not the whole
      # lockfile — unrelated dependency bumps shouldn't force a ~150MB
      # Chromium re-download.
      - name: Get Playwright version
        if: steps.stripe-config.outputs.enabled == 'true'
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.stripe-config.outputs.enabled == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.stripe-config.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps only
        if: steps.stripe-config.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Build project backend image
        if: steps.stripe-config.outputs.enabled == 'true'
        run: docker build -t project-spree:e2e "$GITHUB_WORKSPACE/backend"
      - name: Boot Spree backend (project backend image)
        if: steps.stripe-config.outputs.enabled == 'true'
        env:
          SPREE_IMAGE: project-spree:e2e
        run: docker compose -f e2e-backend/docker-compose.yml up -d --wait
      - name: Seed Spree and issue API key
        if: steps.stripe-config.outputs.enabled == 'true'
        env:
          # Test-mode Stripe key pair from one sandbox account, consumed by
          # bootstrap-spree.sh to configure the Spree Stripe gateway. Scoped
          # to this step so dependency postinstall scripts and third-party actions
          # in other steps never see the secret.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        run: ./scripts/e2e/bootstrap-spree.sh
      - name: Run Playwright tests
        if: steps.stripe-config.outputs.enabled == 'true'
        run: pnpm run test:e2e
      - name: Dump Spree logs on failure
        if: failure()
        run: docker compose -f e2e-backend/docker-compose.yml logs --no-color web > spree.log || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            spree.log
          retention-days: 7
      - name: Tear down
        if: always() && steps.stripe-config.outputs.enabled == 'true'
        run: docker compose -f e2e-backend/docker-compose.yml down -v
