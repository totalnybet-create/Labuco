name: Fix mobile hero temporary

on:
  push:
    branches:
      - fix/mobile-hero-benefits-overlap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Patch existing mobile hero rule
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/storefront/src/app/labuco.css")
          css = path.read_text()
          old = """  .labuco-hero-benefits {\n    width: 134%;\n  }\n"""
          new = """  .labuco-hero-benefits {\n    display: none;\n  }\n"""
          if css.count(old) != 1:
              raise SystemExit(f"Expected exactly one mobile hero benefits rule, found {css.count(old)}")
          path.write_text(css.replace(old, new, 1))

      - name: Commit CSS change only
        shell: bash
        run: |
          set -euo pipefail
          git add apps/storefront/src/app/labuco.css
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: prevent mobile hero benefit overlap"
          git push
