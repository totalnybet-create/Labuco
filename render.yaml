# Render Blueprint — LABUCO backend + Postgres.
services:
  - type: web
    name: spree
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spree-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_LEVEL
        value: info

      # Stripe — optional. Leave unset while the account is not active.
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

      # HotPay — add after the LABUCO service is accepted in HotPay.
      # The notification URL to configure in HotPay is:
      # https://<backend-host>/payments/hotpay/webhook
      - key: HOTPAY_SECRET
        sync: false
      - key: HOTPAY_NOTIFICATION_PASSWORD
        sync: false
      - key: HOTPAY_ENFORCE_IP_WHITELIST
        value: "true"

      # PayPal — optional second online method.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_TEST_MODE
        value: "true"

      # Public receiving account used by the manual bank-transfer method.
      - key: LABUCO_BANK_ACCOUNT
        value: "PL88 1050 1748 1000 0098 5745 4228"

      - key: MISSION_CONTROL_USER
        value: jobs
      - key: MISSION_CONTROL_PASSWORD
        generateValue: true

  # Scale-out: uncomment to split job processing into a dedicated worker
  # when moving to a plan that supports it.
  # - type: worker
  #   name: spree-worker
  #   runtime: docker
  #   plan: standard
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: .
  #   dockerCommand: bin/jobs

databases:
  - name: spree-db
    plan: free
    databaseName: spree
    postgresMajorVersion: "18"
    ipAllowList: []
